{{- if .Values.rollout.enabled -}}
{{- if eq "bluegreen" (lower .Values.rollout.strategy) -}}
{{- if .Values.rollout.ingress.enabled -}}
{{- $fullName := include "app.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-preview
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.rollout.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.rollout.ingress.ingressClassName }}
  ingressClassName: {{ .Values.rollout.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- range .Values.rollout.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ $fullName }}-preview
              port:
                number: {{ $svcPort }}
        {{- end }}
    {{- end }}

  {{- if .Values.rollout.ingress.tls }}
  tls:
    {{- range .Values.rollout.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}