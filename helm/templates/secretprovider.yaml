{{- if .Values.keyvault.enabled -}}
kind: SecretProviderClass
apiVersion: secrets-store.csi.x-k8s.io/v1
metadata:
  name: {{ include "app.fullname" . }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"          # Set to true for using managed identity
    userAssignedIdentityID: {{ .Values.keyvault.userAssignedIdentityID }}     # Set the clientID of the user-assigned managed identity to use
    keyvaultName: {{ .Values.keyvault.name }}        # Set to the name of your key vault
    tenantId: {{ .Values.keyvault.tenantId }}    # The tenant ID of the key vault
    objects: |
      array:
        - |
          objectName: elasticapm-apikey
          objectType: secret              
        - |
          objectName: serilog-writeto-1-args-connectionglobalheaders
          objectType: secret
  secretObjects:
    - secretName: elasticapm-apikey
      data:
       - key: elasticapm-apikey
         objectName: elasticapm-apikey
      type: Opaque
    - secretName: serilog-writeto-1-args-connectionglobalheaders
      data:
        - key: serilog-writeto-1-args-connectionglobalheaders
          objectName: serilog-writeto-1-args-connectionglobalheaders
      type: Opaque
{{- end }}