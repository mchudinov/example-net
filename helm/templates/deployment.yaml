{{- if not .Values.rollout.enabled -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      automountServiceAccountToken: false
      priorityClassName: {{ include "app.priorityClassName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 50001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: Settings__TimeSpan
              value: "{{ .Values.settings.timeSpan }}"
            {{ if .Values.elastic.apm.enabled }}
            - name: ElasticApm__Enabled
              value: "{{ .Values.elastic.apm.enabled }}"
            {{- end }}
            {{ if .Values.elastic.log.enabled }}  
            - name: Serilog__WriteTo__1__restrictedToMinimumLevel
              value: {{ .Values.elastic.log.level }}
            {{- end }}
            {{ if .Values.keyvault.enabled }}
            - name: ElasticApm__ApiKey
              valueFrom:
                secretKeyRef:
                  name: elasticapm-apikey
                  key: elasticapm-apikey
            - name: Serilog__WriteTo__1__Args__ConnectionGlobalHeaders
              valueFrom:
                secretKeyRef:
                  name: serilog-writeto-1-args-connectionglobalheaders
                  key: serilog-writeto-1-args-connectionglobalheaders
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}