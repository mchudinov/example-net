apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "app.name" . }}-test-connection"
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox:1.35
      imagePullPolicy: Always
      command: ['wget']
      args: ['{{ include "app.name" . }}:{{ .Values.service.port }}']
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ ALL ]
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          memory: 64Mi
          cpu: 20m
        requests:
          memory: 32Mi
          cpu: 10m           
  restartPolicy: Never
