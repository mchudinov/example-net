{{- if .Values.rollout.enabled -}}
{{- if eq "bluegreen" (lower .Values.rollout.strategy) -}}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "app.name" . }}-preview
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}