# replicaCount does not affect if autoscaling is enabled. This is by default. 
replicaCount: 1

image:
  repository: ghcr.io/wss-ea-cloud-devops/example-net-docker
  pullPolicy: Always
  tag: ""

imagePullSecrets: [{ name: container-registry-pullsecret }]
nameOverride: ""
fullnameOverride: ""

settings:
  timeSpan: 5
  logLevel: Information

elastic:
  log:
    enabled: false
    nodeUris: "https://example.com"
    indexFormat: "example-net-{0:yyyy}"
    connectionGlobalHeaders: "Authorization=Basic login:passwordbase64="
  apm:
    enabled: false
    serverUrls: "https://example.com"
    serviceName: "example-net"
    environment: development
    metricsInterval: "2m"
    apiKey: "dummy=="
    
keyvault:
  enabled: false
  name: kv-mp-example-net-sol
  userAssignedIdentityID: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx    # appid for example azurekeyvaultsecretsprovider-aks-mp-mgmt-cl1-sol
  tenantId: 5d0227ad-3bcc-4106-8cf3-16e735f3b4c4

priorityClassName: user-normal

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop: [ ALL ]
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
          
service:
  enabled: true
  type: ClusterIP
  port: 50001

rollout:
  enabled: false
  strategy: BlueGreen
  autoPromotionEnabled: false
  autoPromotionSeconds: 60
  ingress:
    enabled: false

ingress:
  enabled: false

resources: 
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPU: 80
  targetMemory: 80

nodeSelector: {}

tolerations: []

affinity: {}
