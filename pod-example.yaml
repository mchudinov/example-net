kind: Pod
apiVersion: v1
metadata:
  namespace: example-net
  name: example-net-test
spec:
  imagePullSecrets:
    - name: container-registry-pullsecret
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000 
  containers:
  - name: example-net
    image: ghcr.io/wss-ea-cloud-devops/example-net-docker:0.2.7
    imagePullPolicy: Always
    ports:
    - name: http
      containerPort: 50001
      protocol: TCP
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ ALL ]
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /livez
        port: http
      initialDelaySeconds: 120
      periodSeconds: 60
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 120