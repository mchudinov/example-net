name: Release

# One run per tag publishes the image and the chart, both built from the tag's commit. A release writes nothing
# to the repository: the chart's version and appVersion are stamped from the tag when Check-Helm packages it.
on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: example-net-docker
  DOCKER_WORKING_DIRECTORY: './'
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # Every other job waits for this one, so a malformed tag fails in seconds and publishes nothing.
  Check-Tag:
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Check that the tag is an exact release version
      run: |
        if [[ ! "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::$GITHUB_REF is not a release tag. Use vMAJOR.MINOR.PATCH with no suffix, for example v1.3.2. Release candidates are not allowed."
          exit 1
        fi

    # The release version, without the v. Check-Helm packages the chart at it.
    - name: Output the release version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Release gate: build and test the tagged source. The image waits for this and for Check-Helm.
  Test:
    needs: Check-Tag
    uses: ./.github/workflows/build-dotnet.yaml
    permissions:
      contents: read

  # Chart checks, alongside Test. Packages the chart once at the tag's version and uploads it; Push-Helm publishes
  # that same file.
  Check-Helm:
    needs: Check-Tag
    uses: ./.github/workflows/build-helm.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.Check-Tag.outputs.version }}

  Build-and-Push-Docker:
    needs: [Test, Check-Helm]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      docker_image_version: ${{ steps.docker-image-catch.outputs.DOCKER_VERSION }}
      docker_image_digest: ${{ steps.docker-image-push.outputs.digest }}
      registry_lowercase: ${{ steps.docker-image-catch.outputs.REGISTRY_LOWERCASE }}

    steps:
    - uses: actions/checkout@v7

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Catch Docker image version
      id: docker-image-catch
      run: |
        echo "DOCKER_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}">>${GITHUB_OUTPUT}
        echo "DOCKER_REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}">>${GITHUB_OUTPUT}
        INPUT=${{ env.REGISTRY }}; echo "REGISTRY_LOWERCASE=${INPUT,,}">>${GITHUB_OUTPUT}

    - name: Print Docker image info
      run: |
        echo Registry: ${{steps.docker-image-catch.outputs.REGISTRY_LOWERCASE}}
        echo Docker image name: ${{ env.IMAGE_NAME }}
        echo Docker image version: ${{ steps.docker-image-catch.outputs.DOCKER_VERSION }}
        echo Docker image revision: ${{ steps.docker-image-catch.outputs.DOCKER_REVISION }}

    - name: Login to GitHub container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.GHCR_USERNAME }}
        password: ${{ env.GHCR_PASSWORD }}

    - name: Build and push Docker image
      id: docker-image-push  
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKER_WORKING_DIRECTORY }}
        # Must match the list in check-docker.yaml.
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  Sign-Docker-Image:
    needs: Build-and-Push-Docker
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:
    - name: Login to GitHub container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.GHCR_USERNAME }}
        password: ${{ env.GHCR_PASSWORD }}    

    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.3

    # cosign takes the services from Sigstore's TUF repository and verifies them. Without Rekor, nothing goes to the transparency log.
    - name: Create signing config without Rekor
      run: cosign signing-config create --with-default-services --no-default-rekor --out "$RUNNER_TEMP/signing-config-no-tlog.json"

    - name: Sign the image
      run: |
        cosign sign ${{needs.Build-and-Push-Docker.outputs.registry_lowercase}}/${{ env.IMAGE_NAME }}@${{needs.Build-and-Push-Docker.outputs.docker_image_digest}} \
          --yes \
          --signing-config "$RUNNER_TEMP/signing-config-no-tlog.json"

    - name: Verify the signature
      run: |
        cosign verify ${{needs.Build-and-Push-Docker.outputs.registry_lowercase}}/${{ env.IMAGE_NAME }}@${{needs.Build-and-Push-Docker.outputs.docker_image_digest}} \
          --certificate-identity-regexp '.+github.com\/${{ github.repository_owner }}.+' \
          --certificate-oidc-issuer ${{ env.OIDC_ISSUER }} \
          --insecure-ignore-tlog=true

  # Publishes the package Check-Helm checked, and only after the image has been signed.
  Push-Helm:
    needs: [Check-Helm, Sign-Docker-Image]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
    - name: Helm installation
      uses: azure/setup-helm@v5

    - name: Download the checked chart package
      uses: actions/download-artifact@v8
      with:
        name: helm-chart
        path: ${{ runner.temp }}/helm-chart

    # Helm keeps its own registry credentials, so it needs its own login; cosign uses docker/login-action's.
    - name: Login to GHCR using Helm
      run: echo "$GHCR_PASSWORD" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

    # Check-Helm falls back to the chart's placeholder version when it gets none, and pushing that would replace
    # a chart that is already published.
    - name: Check that the chart version is the tag's
      env:
        CHART_VERSION: ${{ needs.Check-Helm.outputs.chart_version }}
      run: |
        if [[ "$CHART_VERSION" != "${GITHUB_REF_NAME#v}" ]]; then
          echo "::error::The checked chart has version '$CHART_VERSION', not the tag's version ${GITHUB_REF_NAME#v}. Nothing was pushed."
          exit 1
        fi

    - name: Publish chart to GHCR
      env:
        CHART_FILE: ${{ needs.Check-Helm.outputs.chart_file }}
        REGISTRY_LOWERCASE: ${{ needs.Check-Helm.outputs.registry_lowercase }}
      run: helm push "$RUNNER_TEMP/helm-chart/$CHART_FILE" "oci://$REGISTRY_LOWERCASE"

  Sign-Helm-Chart:
    needs: [Check-Helm, Push-Helm]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:
      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      # cosign takes the services from Sigstore's TUF repository and verifies them. Without Rekor, nothing goes to the transparency log.
      - name: Create signing config without Rekor
        run: cosign signing-config create --with-default-services --no-default-rekor --out "$RUNNER_TEMP/signing-config-no-tlog.json"

      - name: Sign the chart
        run: |
          cosign sign ${{needs.Check-Helm.outputs.registry_lowercase}}/${{ needs.Check-Helm.outputs.chart_name }}:${{ needs.Check-Helm.outputs.chart_version }} \
            --yes \
            --signing-config "$RUNNER_TEMP/signing-config-no-tlog.json"

      - name: Verify the signature
        run: |
          cosign verify ${{needs.Check-Helm.outputs.registry_lowercase}}/${{ needs.Check-Helm.outputs.chart_name }}:${{ needs.Check-Helm.outputs.chart_version }} \
            --certificate-identity-regexp '.+github.com\/${{ github.repository_owner }}.+' \
            --certificate-oidc-issuer ${{ env.OIDC_ISSUER }} \
            --insecure-ignore-tlog=true
