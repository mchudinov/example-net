name: Build-Helm

# Checks the chart and publishes nothing. Release calls it before it pushes the image, then publishes the
# package this workflow uploads.
on:
  workflow_dispatch:
  # Path filters do not apply to calls.
  workflow_call:
    inputs:
      version:
        description: Version and app version to package the chart at, without the leading v. Empty means Chart.yaml's version.
        type: string
        required: false
        default: ''
    outputs:
      chart_name:
        description: The chart's name
        value: ${{ jobs.Check-Helm.outputs.chart_name }}
      chart_version:
        description: The version the checked package was built at
        value: ${{ jobs.Check-Helm.outputs.chart_version }}
      chart_file:
        description: File name of the checked package, uploaded as the helm-chart artifact
        value: ${{ jobs.Check-Helm.outputs.chart_file }}
      registry_lowercase:
        description: The registry namespace, in lowercase
        value: ${{ jobs.Check-Helm.outputs.registry_lowercase }}
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/build-helm.yaml'
      - '.github/scripts/check-chart-labels.sh'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/build-helm.yaml'
      - '.github/scripts/check-chart-labels.sh'

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  HELM_WORKING_DIRECTORY: helm
  POLARIS_VERSION: 8.5.5
  POLARIS_EXIT_SCORE: 90

jobs:
  Check-Helm:
    runs-on: ubuntu-latest

    outputs:
      chart_version: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
      chart_name: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
      registry_lowercase: ${{ steps.helm-chart-catch.outputs.REGISTRY_LOWERCASE }}
      chart_file: ${{ steps.helm-package.outputs.CHART_FILE }}

    steps:
    - uses: actions/checkout@v7

    - name: Helm installation
      uses: azure/setup-helm@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Release passes the tag's version; every other run uses Chart.yaml's, which is a placeholder. A tag push
    # reaches this step only through Release, so an empty input there means the version wasn't passed on.
    # Falling back would package the placeholder version, and Release would replace that published chart.
    - name: Extract chart info
      id: helm-chart-catch
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ -z "$INPUT_VERSION" && "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
          echo "::error::No chart version was passed in for $GITHUB_REF. Release must pass the tag's version to this workflow."
          exit 1
        fi
        VERSION="${INPUT_VERSION:-$(sed -n 's/^version: //p' ./Chart.yaml)}"
        echo "CHART_VERSION=$VERSION">>${GITHUB_OUTPUT}
        echo "CHART_NAME=$(sed -n 's/^name: //p' ./Chart.yaml)">>${GITHUB_OUTPUT}
        INPUT=${{ env.REGISTRY }}; echo "REGISTRY_LOWERCASE=${INPUT,,}">>${GITHUB_OUTPUT}

    - name: Print chart info
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      run: |
        echo Chart name: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
        echo Chart version: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
        echo GitHub container registry: ${{steps.helm-chart-catch.outputs.REGISTRY_LOWERCASE}}

    # Packaged once. Lint and both installs of this version use this file, and Release publishes this same file.
    # It goes to $RUNNER_TEMP because .helmignore doesn't exclude *.tgz, so a package left in helm/ would end up
    # inside the next one.
    - name: Package helm
      id: helm-package
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      env:
        CHART_NAME: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
        CHART_VERSION: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
      run: |
        helm package ./ --version "$CHART_VERSION" --app-version "$CHART_VERSION" --destination "$RUNNER_TEMP"
        echo "CHART_FILE=$CHART_NAME-$CHART_VERSION.tgz">>${GITHUB_OUTPUT}
        echo "CHART_PACKAGE=$RUNNER_TEMP/$CHART_NAME-$CHART_VERSION.tgz">>${GITHUB_OUTPUT}

    - name: Lint helm
      env:
        CHART_PACKAGE: ${{ steps.helm-package.outputs.CHART_PACKAGE }}
      run: helm lint "$CHART_PACKAGE" --strict

    # k3d waits for its nodes with no limit of its own. The timeout kills only the k3d client, so the containers stay for the next step.
    - name: Create a test k3d cluster for dry-run install
      id: k3d
      uses: AbsaOSS/k3d-action@v2
      timeout-minutes: 5
      with:
        cluster-name: "test-cluster"
        # The action runs k3d's install.sh from its main branch. That script also downloads the release's
        # checksums.txt (k3d-io/k3d#1653), which the action's default k3d v5.4.6 doesn't publish (HTTP 404).
        k3d-version: v5.9.0
        args: --agents 1

    - name: Show the k3d containers and logs after a failed cluster start
      if: failure() && steps.k3d.outcome == 'failure'
      run: |
        docker ps -a --filter label=app=k3d
        for container in $(docker ps -aq --filter label=app=k3d); do
          echo "::group::$(docker inspect --format '{{.Name}}' "$container")"
          docker logs "$container" || true
          echo "::endgroup::"
        done

    - name: Dry-run install
      env:
        CHART_PACKAGE: ${{ steps.helm-package.outputs.CHART_PACKAGE }}
      run: helm install --dry-run --generate-name "$CHART_PACKAGE"

    # Flux installs a chart from an OCIRepository with the digest appended to its version, and "+" is invalid in a
    # label value.
    - name: Package helm with build metadata in the version
      id: helm-package-build-metadata
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      env:
        CHART_NAME: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
        CHART_VERSION: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
      run: |
        VERSION="$CHART_VERSION+662a06b343e7"
        helm package ./ --version "$VERSION" --app-version "$CHART_VERSION" --destination "$RUNNER_TEMP"
        echo "CHART_PACKAGE=$RUNNER_TEMP/$CHART_NAME-$VERSION.tgz">>${GITHUB_OUTPUT}

    # Together these value sets render every template that sets labels. A default install reaches only three of
    # them, and k3d has no CRDs for the Rollout. A new flag that guards a template with labels must be added here.
    - name: Check label values with build metadata in the version
      env:
        CHART_PACKAGE: ${{ steps.helm-package-build-metadata.outputs.CHART_PACKAGE }}
      run: |
        bash .github/scripts/check-chart-labels.sh "$CHART_PACKAGE" \
          --set ingress.enabled=true --set autoscaling.enabled=true
        bash .github/scripts/check-chart-labels.sh "$CHART_PACKAGE" \
          --set rollout.enabled=true --set rollout.strategy=bluegreen \
          --set rollout.ingress.enabled=true --set autoscaling.enabled=true

    # No --wait or --atomic: in a release this runs before the release's image is pushed, so the pods can't pull it yet.
    - name: Test install helm chart
      env:
        CHART_PACKAGE: ${{ steps.helm-package.outputs.CHART_PACKAGE }}
      run: helm install "$CHART_PACKAGE" --generate-name

    # Its own namespace: object names come from the chart name, so they would collide with the install above.
    - name: Test install helm chart with build metadata in the version
      env:
        CHART_PACKAGE: ${{ steps.helm-package-build-metadata.outputs.CHART_PACKAGE }}
      run: helm install "$CHART_PACKAGE" --generate-name --namespace build-metadata --create-namespace

    # Optional steps check Helm chart with Fairwinds Polaris tool
    # The ref only picks this installer. POLARIS_VERSION picks the binary it downloads, so the two can differ.
    - name: Setup Polaris
      uses: FairwindsOps/polaris/.github/actions/setup-polaris@v10.2.6
      with:
        version: ${{ env.POLARIS_VERSION }}

    - name: Use Polaris
      run: |
        polaris audit --helm-chart ${{ env.HELM_WORKING_DIRECTORY }} \
          --helm-values ./${{ env.HELM_WORKING_DIRECTORY }}/values.yaml \
          --only-show-failed-tests --format=pretty --set-exit-code-on-danger \
          --set-exit-code-below-score ${{ env.POLARIS_EXIT_SCORE }} \
          --config .github/polaris-config.yaml

    # Last, so a run whose checks fail uploads nothing. Release downloads this file and publishes it unchanged.
    # overwrite lets "Re-run all jobs" upload it again under the same name.
    - name: Upload the checked chart package
      uses: actions/upload-artifact@v7
      with:
        name: helm-chart
        path: ${{ steps.helm-package.outputs.CHART_PACKAGE }}
        if-no-files-found: error
        overwrite: true
