name: Build-Helm

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build-Docker]
    types: [completed]    
  push:
    branches: [main]
    paths: ['helm/**']      
  pull_request:
    branches: [main]
    paths: ['helm/**']

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  HELM_WORKING_DIRECTORY: helm
  POLARIS_VERSION: 8.5.5
  POLARIS_EXIT_SCORE: 90

jobs:
  Check-Helm:
    # After a Build-Docker run, publish only if that run succeeded ("completed" also fires on failure).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      chart_version: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
      chart_name: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
      registry_lowercase: ${{ steps.helm-chart-catch.outputs.REGISTRY_LOWERCASE }}      

    steps:
    - uses: actions/checkout@v6

    - name: Helm installation
      uses: azure/setup-helm@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Extract chart info
      id: helm-chart-catch
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      run: |
        echo "CHART_VERSION=$(grep 'version:' ./Chart.yaml | tail -n1 | awk '{ print $2}')">>${GITHUB_OUTPUT}
        echo "CHART_NAME=$(grep 'name:' ./Chart.yaml | tail -n1 | awk '{ print $2}')">>${GITHUB_OUTPUT}
        INPUT=${{ env.REGISTRY }}; echo "REGISTRY_LOWERCASE=${INPUT,,}">>${GITHUB_OUTPUT}

    - name: Print chart info
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      run: |
        echo Chart name: ${{ steps.helm-chart-catch.outputs.CHART_NAME }}
        echo Chart version: ${{ steps.helm-chart-catch.outputs.CHART_VERSION }}
        echo GitHub container registry: ${{steps.helm-chart-catch.outputs.REGISTRY_LOWERCASE}}

    - name: Lint helm
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}     
      run: helm lint . --strict
      
    - name: Create a test k3d cluster for dry-run install
      uses: AbsaOSS/k3d-action@v2
      with:
        cluster-name: "test-cluster"
        # The action runs k3d's install.sh from its main branch. That script also downloads the release's
        # checksums.txt (k3d-io/k3d#1653), which the action's default k3d v5.4.6 doesn't publish (HTTP 404).
        k3d-version: v5.9.0
        args: --agents 1
  
    - name: Dry-run install
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}     
      run: |
        helm install --dry-run --generate-name ./

    - name: Package helm
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}     
      run: helm package ./

    - name: Test install helm chart
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      run: helm install ./"${{steps.helm-chart-catch.outputs.CHART_NAME}}-${{steps.helm-chart-catch.outputs.CHART_VERSION}}.tgz" --generate-name

    # Optional steps check Helm chart with Fairwinds Polaris tool
    - name: Setup Polaris
      uses: FairwindsOps/polaris/.github/actions/setup-polaris@master
      with:
        version: ${{ env.POLARIS_VERSION }}

    - name: Use Polaris
      run: polaris audit --helm-chart ${{ env.HELM_WORKING_DIRECTORY }} \
        --helm-values ./${{ env.HELM_WORKING_DIRECTORY }}/values.yaml \
        --only-show-failed-tests true --format=pretty --set-exit-code-on-danger \
        --set-exit-code-below-score ${{ env.POLARIS_EXIT_SCORE }} \
        --config .github/polaris-config.yaml

  Build-and-Push-Helm:
    needs: Check-Helm
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:      
      - uses: actions/checkout@v6    

      - name: Helm installation
        uses: azure/setup-helm@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package helm
        working-directory: ${{ env.HELM_WORKING_DIRECTORY }}     
        run: helm package ./

      - name: Login to GHCR using Helm
        run: echo ${{ env.GHCR_PASSWORD }}  | helm registry login ghcr.io --username ${{ env.GHCR_USERNAME }} --password-stdin

      - name: Publish chart to GHCR
        working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
        run: helm push "${{needs.Check-Helm.outputs.CHART_NAME}}-${{needs.Check-Helm.outputs.CHART_VERSION}}.tgz" oci://${{needs.Check-Helm.outputs.REGISTRY_LOWERCASE}}

  Sign-Helm-Chart:
    needs: [Check-Helm, Build-and-Push-Helm]
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      packages: write
    
    steps:
      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Create signing config without Rekor
        run: |
          curl -s https://raw.githubusercontent.com/sigstore/root-signing/refs/heads/main/targets/signing_config.v0.2.json \
            | jq 'del(.rekorTlogUrls)' > "$RUNNER_TEMP/signing-config-no-tlog.json"         

      - name: Sign the chart
        run: |
          cosign sign ${{needs.Check-Helm.outputs.registry_lowercase}}/${{ needs.Check-Helm.outputs.chart_name }}:${{ needs.Check-Helm.outputs.chart_version }} \
            --yes \
            --signing-config "$RUNNER_TEMP/signing-config-no-tlog.json"
  
      - name: Verify the signature
        run: |
          cosign verify ${{needs.Check-Helm.outputs.registry_lowercase}}/${{ needs.Check-Helm.outputs.chart_name }}:${{ needs.Check-Helm.outputs.chart_version }} \
            --certificate-identity-regexp '.+github.com\/${{ github.repository_owner }}.+' \
            --certificate-oidc-issuer ${{ env.OIDC_ISSUER }} \
            --insecure-ignore-tlog=true