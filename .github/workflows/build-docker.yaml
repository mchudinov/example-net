name: Build-Docker

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: example-net-docker
  HELM_WORKING_DIRECTORY: helm
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }} 
  BRANCH: master
  
jobs:
  Build-and-Push-Docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      docker_image_version: ${{ steps.docker-image-catch.outputs.DOCKER_VERSION }}

    steps:
    - uses: actions/checkout@v4

    - name: Convert to lowercase
      id: toLowerCase
      run: echo "::set-output name=lowerCaseRegistry::${${{ env.REGISTRY }},,}"
    - run: echo ${{steps.toLowerCase.outputs.lowerCaseRegistry}}  

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{steps.toLowerCase.outputs.lowerCaseRegistry}}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}        

    - name: Build and export to Docker for test step
      uses: docker/build-push-action@v5
      with:
        load: true
        push: false
        tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Catch Docker image version
      id: docker-image-catch
      run: |
        echo "DOCKER_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}">>${GITHUB_OUTPUT}
        echo "DOCKER_REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}">>${GITHUB_OUTPUT}

    - name: Print Docker image info
      run: |
        echo Docker image name: ${{ env.IMAGE_NAME }}
        echo Docker image version: ${{ steps.docker-image-catch.outputs.DOCKER_VERSION }}
        echo Docker image revision: ${{ steps.docker-image-catch.outputs.DOCKER_REVISION }}

    - name: Login to GitHub container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.GHCR_USERNAME }}
        password: ${{ env.GHCR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - uses: sigstore/cosign-installer@main
    - name: Sign the image      
      run: |
        cosign sign ${{steps.toLowerCase.outputs.lowerCaseRegistry}}/${{ env.IMAGE_NAME }}:${{ steps.docker-image-catch.outputs.DOCKER_VERSION }} -y
      env:
        COSIGN_EXPERIMENTAL: 1        

  Update-Chart-Version:
    needs: Build-and-Push-Docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.BRANCH }}

    - name: Print Docker image version
      run: echo "Docker image version ${{ needs.Build-and-Push-Docker.outputs.docker_image_version }}"

    - name: Print Chart.yaml before change
      run: cat ${{ env.HELM_WORKING_DIRECTORY }}/Chart.yaml

    - name: Change Docker image version and chart version in the Chart.yaml
      uses: mikefarah/yq@v4.28.2
      with:
        cmd: yq -i ' 
              .version = "${{ needs.Build-and-Push-Docker.outputs.docker_image_version }}" | 
              .appVersion = "${{ needs.Build-and-Push-Docker.outputs.docker_image_version }}" ' 
              ./${{ env.HELM_WORKING_DIRECTORY }}/Chart.yaml
        
    - name: Print Chart.yaml after change
      run: cat ${{ env.HELM_WORKING_DIRECTORY }}/Chart.yaml

    - name: Lint helm
      working-directory: ${{ env.HELM_WORKING_DIRECTORY }}
      run: helm lint --strict

    - name: Commit chart version change
      uses: planetscale/ghcommit-action@v0.1.6
      with:
        commit_message: "Change chart version to ${{ needs.Build-and-Push-Docker.outputs.docker_image_version }}"
        repo: ${{ github.repository }}
        branch: ${{ github.head_ref || github.ref_name }}
        file_pattern: 'Chart.yaml'
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}